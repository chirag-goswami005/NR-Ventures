<div class="dashboard">

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">

        <div class="logo">
            <h2>NR Ventures</h2>
            <p>Admin Panel</p>
        </div>

        <ul>
            <li>
                <a href="{% url 'admin_dashboard' %}">
                    🏠 Dashboard
                </a>
            </li>

            <li>
                <a href="{% url 'add_product' %}">
                    📦 Products
                </a>
            </li>

        </ul>

    </div>

    <!-- MAIN -->
    <div class="main">

        <!-- HEADER -->
        <div class="header">

            <div class="left-header">
                <button class="menu-btn" onclick="toggleSidebar()">
                    ☰
                </button>

                <h2>Dashboard 🚀</h2>
            </div>

                

        </div>

        <!-- STATS -->
        <div class="stats-grid">

            <div class="card-box">
                <h2>{{ total_categories }}</h2>
                <p>Total Categories</p>
            </div>

            <div class="card-box">
                <h2>{{ total_products }}</h2>
                <p>Total Products</p>
            </div>

            <div class="card-box">
                <h2>{{ total_inquiries }}</h2>
                <p>Total Inquiries</p>
            </div>

        </div>

        <!-- ANALYTICS -->
        <div class="stats-grid">

            <div class="card-box danger">
                <h3 id="new-count">0</h3>
                <p>New</p>
            </div>

            <div class="card-box warning">
                <h3 id="contacted-count">0</h3>
                <p>Contacted</p>
            </div>

            <div class="card-box success">
                <h3 id="closed-count">0</h3>
                <p>Closed</p>
            </div>

            <div class="card-box info">
                <h3 id="conversion-rate">0%</h3>
                <p>Conversion</p>
            </div>

        </div>

        <!-- TABLE -->
        <div class="table-box">

            <div class="table-header">
                <h3>Live Inquiries</h3>
            </div>

            <div class="table-responsive">

                <table>

                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Phone</th>
                            <th>Status</th>
                            <th>Priority</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="inquiry-body"></tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<audio id="notif-sound"
src="https://www.soundjay.com/buttons/sounds/button-3.mp3">
</audio>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#0f172a;
    color:white;
}

/* DASHBOARD */
.dashboard{
    display:flex;
}

/* SIDEBAR */
.sidebar{
    width:250px;
    height:100vh;
    background:#111827;
    position:fixed;
    left:0;
    top:0;
    padding:25px;
    transition:0.3s;
    overflow:auto;
}

.sidebar.active{
    left:-260px;
}

.logo{
    margin-bottom:30px;
}

.logo h2{
    color:#38bdf8;
}

.logo p{
    color:#94a3b8;
    font-size:14px;
}

.sidebar ul{
    list-style:none;
}

.sidebar ul li{
    margin-bottom:10px;
}

.sidebar ul li a{
    display:block;
    padding:14px;
    border-radius:10px;
    color:white;
    text-decoration:none;
    transition:0.3s;
    background:rgba(255,255,255,0.03);
}

.sidebar ul li a:hover{
    background:#38bdf8;
    transform:translateX(5px);
}

/* MAIN */
.main{
    margin-left:250px;
    width:100%;
    padding:25px;
}

/* HEADER */
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.left-header{
    display:flex;
    align-items:center;
    gap:15px;
}

.menu-btn{
    background:#38bdf8;
    border:none;
    color:white;
    padding:10px 14px;
    border-radius:8px;
    cursor:pointer;
    font-size:18px;
}

/* NOTIFICATION */
.notification{
    position:relative;
    font-size:24px;
    cursor:pointer;
}

.notification span{
    position:absolute;
    top:-10px;
    right:-10px;
    background:red;
    color:white;
    font-size:12px;
    width:20px;
    height:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
}

/* GRID */
.stats-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:25px;
}

/* CARD */
.card-box{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.08);
    backdrop-filter:blur(12px);
    border-radius:18px;
    padding:25px;
    text-align:center;
    transition:0.3s;
}

.card-box:hover{
    transform:translateY(-5px);
}

.card-box h2,
.card-box h3{
    font-size:35px;
    margin-bottom:10px;
}

.card-box p{
    color:#cbd5e1;
}

.danger{
    background:rgba(239,68,68,0.15);
}

.warning{
    background:rgba(245,158,11,0.15);
}

.success{
    background:rgba(34,197,94,0.15);
}

.info{
    background:rgba(59,130,246,0.15);
}

/* TABLE */
.table-box{
    background:#111827;
    border-radius:18px;
    padding:25px;
    overflow:hidden;
}

.table-header{
    margin-bottom:20px;
}

.table-responsive{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

thead{
    background:#1e293b;
}

th{
    padding:15px;
    text-align:left;
    color:#38bdf8;
}

td{
    padding:15px;
    border-bottom:1px solid rgba(255,255,255,0.05);
}

tr:hover{
    background:rgba(255,255,255,0.03);
}

/* BADGE */
.badge{
    padding:6px 12px;
    border-radius:30px;
    font-size:13px;
    font-weight:bold;
    display:inline-block;
}

.bg-danger{
    background:#ef4444;
}

.bg-warning{
    background:#f59e0b;
}

.bg-success{
    background:#22c55e;
}

.bg-info{
    background:#3b82f6;
}

/* WHATSAPP BUTTON */
.wa-btn{
    background:#22c55e;
    color:white;
    text-decoration:none;
    padding:8px 14px;
    border-radius:8px;
    display:inline-block;
    transition:0.3s;
}

.wa-btn:hover{
    background:#16a34a;
}

/* MOBILE */
@media(max-width:768px){

    .sidebar{
        left:-260px;
        z-index:999;
    }

    .sidebar.active{
        left:0;
    }

    .main{
        margin-left:0;
    }

}

</style>

<script>

function toggleSidebar(){
    document.getElementById("sidebar").classList.toggle("active");
}

let lastCount = 0;

function loadInquiries(){

    fetch('/api/inquiries/')

    .then(res => res.json())

    .then(data => {

        let body = document.getElementById('inquiry-body');

        body.innerHTML = '';

        let newCount = 0;
        let contacted = 0;
        let closed = 0;

        data.inquiries.forEach(i => {

            if(i.status === 'new') newCount++;
            if(i.status === 'contacted') contacted++;
            if(i.status === 'closed') closed++;

            let status = i.status === 'new'
                ? '<span class="badge bg-danger">New</span>'
                : i.status === 'contacted'
                ? '<span class="badge bg-warning">Contacted</span>'
                : '<span class="badge bg-success">Closed</span>';

            let priority = i.priority === 'high'
                ? '<span class="badge bg-danger">High</span>'
                : i.priority === 'medium'
                ? '<span class="badge bg-warning">Medium</span>'
                : '<span class="badge bg-info">Low</span>';

            let row = `
                <tr>
                    <td>${i.name}</td>
                    <td>${i.phone}</td>
                    <td>${status}</td>
                    <td>${priority}</td>
                    <td>
                        <a class="wa-btn"
                        href="https://wa.me/${i.phone}"
                        target="_blank">
                        WhatsApp
                        </a>
                    </td>
                </tr>
            `;

            body.innerHTML += row;

        });

        let total = data.inquiries.length;

        let conversion = total
            ? Math.round((closed / total) * 100)
            : 0;

        document.getElementById('new-count').innerText = newCount;
        document.getElementById('contacted-count').innerText = contacted;
        document.getElementById('closed-count').innerText = closed;
        document.getElementById('conversion-rate').innerText = conversion + "%";

        if(data.unread_count > lastCount){
            document.getElementById("notif-sound").play();
        }

        lastCount = data.unread_count;

        document.getElementById('notif-count').innerText =
        data.unread_count;

    });

}

loadInquiries();

setInterval(loadInquiries, 5000);

</script>
