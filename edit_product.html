{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Product</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#020617,#0f172a);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    color:white;
}

/* CARD */
.edit-box{
    width:100%;
    max-width:780px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    backdrop-filter:blur(18px);
    border-radius:30px;
    padding:40px;
    box-shadow:0 25px 70px rgba(0,0,0,.6);
}

/* TITLE */
.title{
    text-align:center;
    margin-bottom:30px;
}

.title h2{
    font-size:38px;
    font-weight:800;
    color:#38bdf8;
}

.title p{
    color:#94a3b8;
}

/* FORM */
label{
    display:block;
    margin-bottom:10px;
    font-weight:600;
}

input,
textarea,
select,
.form-control,
.form-select{
    width:100%;
    padding:15px;
    border-radius:14px !important;
    border:1px solid rgba(255,255,255,0.15) !important;
    background:rgba(255,255,255,0.03) !important;
    color:white !important;
}

/* IMAGE */
.image-preview{
    text-align:center;
    margin-top:20px;
}

.image-preview img{
    width:240px;
    height:240px;
    object-fit:cover;
    border-radius:20px;
    border:2px solid rgba(255,255,255,0.1);
    background:#0f172a;
}

/* REMOVE */
.remove-box{
    margin-top:15px;
    text-align:center;
    color:#f87171;
}

.remove-box input{
    width:auto;
}

/* BUTTONS */
.btn-box{
    display:flex;
    gap:15px;
    margin-top:30px;
}

.btn-save{
    flex:1;
    border:none;
    padding:15px;
    border-radius:50px;
    font-size:18px;
    font-weight:700;
    color:white;
    background:linear-gradient(135deg,#38bdf8,#2563eb);
}

.btn-back{
    flex:1;
    text-decoration:none;
    text-align:center;
    padding:15px;
    border-radius:50px;
    font-size:18px;
    font-weight:700;
    color:white;
    background:linear-gradient(135deg,#475569,#334155);
}

.btn-save:hover,
.btn-back:hover{
    transform:translateY(-3px);
    transition:.3s;
}

</style>

</head>

<body>

<div class="edit-box">

    <!-- TITLE -->
    <div class="title">
        <h2>✏ Edit Product</h2>
        <p>Update product details</p>
    </div>

    <!-- FORM -->
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <!-- CATEGORY -->
        <div class="mb-3">
            <label>Category</label>
            {{ form.category }}
        </div>

        <!-- NAME -->
        <div class="mb-3">
            <label>Product Name</label>
            {{ form.name }}
        </div>

        <!-- DESCRIPTION -->
        <div class="mb-3">
            <label>Description</label>
            {{ form.description }}
        </div>

        <!-- IMAGE INPUT -->
        <div class="mb-3">

            <label>Product Image</label>

            {{ form.image }}

            <!-- IMAGE PREVIEW (WORKING) -->
            <div class="image-preview">

                {% if product.image %}
                    <img id="previewImage" src="{{ product.image.url }}">
                {% else %}
                    <img id="previewImage" src="{% static 'images/default.jpg' %}">
                {% endif %}

            </div>

        </div>

        <!-- REMOVE IMAGE -->
        {% if product.image %}
        <div class="remove-box">
            <label>
                <input type="checkbox" name="remove_image">
                Remove current image
            </label>
        </div>
        {% endif %}

        <!-- BUTTONS -->
        <div class="btn-box">

            <button type="submit" class="btn-save">
                Update Product 🚀
            </button>

            <a href="{% url 'add_product' %}" class="btn-back">
                Back
            </a>

        </div>

    </form>

</div>

<!-- JS FOR LIVE IMAGE PREVIEW -->
<script>

const imageInput = document.querySelector('input[type="file"]');
const previewImage = document.getElementById('previewImage');

if(imageInput && previewImage){

    imageInput.addEventListener('change', function(e){

        const file = e.target.files[0];

        if(file){

            const reader = new FileReader();

            reader.onload = function(event){
                previewImage.src = event.target.result;
            }

            reader.readAsDataURL(file);
        }

    });

}

</script>

</body>
</html>
